<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wurst AutoBuild System Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import Three.js và OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="app">
        <!-- Sidebar điều khiển -->
        <aside id="sidebar">
            <h2>AutoBuild Studio</h2>
            <p class="subtitle">Tạo và xuất cấu trúc cho Wurst</p>
            
            <div class="input-group">
                <label for="x">Tọa độ X (Trái / Phải)</label>
                <input type="number" id="x" value="0" placeholder="X">
            </div>
            
            <div class="input-group">
                <label for="y">Tọa độ Y (Lên / Xuống)</label>
                <input type="number" id="y" value="0" placeholder="Y">
            </div>
            
            <div class="input-group">
                <label for="z">Tọa độ Z (Tiến / Lùi)</label>
                <input type="number" id="z" value="0" placeholder="Z">
            </div>

            <div class="button-group">
                <button id="add-btn" class="btn primary">Thêm Khối (Add)</button>
                <button id="clear-btn" class="btn danger">Xóa Tất Cả</button>
                <button id="download-btn" class="btn success">Tải JSON</button>
            </div>

            <!-- Bảng hướng dẫn tọa độ -->
            <div class="guide-box">
                <h3> Quy ước tọa độ:</h3>
                <ul>
                    <li><span class="axis-x">■ X:</span> Trái (-) / Phải (+)</li>
                    <li><span class="axis-y">■ Y:</span> Xuống (-) / Lên (+)</li>
                    <li><span class="axis-z">■ Z:</span> Lùi (-) / Tiến (+)</li>
                </ul>
            </div>
        </aside>

        <!-- Khung hiển thị 3D -->
        <main id="visualization"></main>
    </div>

    <script src="script.js"></script>
</body>
</html>
